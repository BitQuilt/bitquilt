<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quilt</title>
<style>
  :root { --bg: #faf7f2; --ink: #1c1a17; --muted: #6b655c; --line: #e3ddd2; --open: #e9e4da; --flight: #d8d0f0; --sealed: #c7c0e8; --verify: #f3d9a4; --disputed: #f0b48a; --prov: #b7dcb0; --acc: #5aa66a; --unreach: #bdb6ab; --locked: #efece6; --unknown: #f6c7c7; }
  @media (prefers-color-scheme: dark) { :root { --bg: #17161a; --ink: #ece7df; --muted: #a39d93; --line: #2b2930; --open: #2e2c33; --locked: #222026; --flight: #3b3360; --sealed: #4a4278; } }
  body { margin: 0; font: 16px/1.45 system-ui, sans-serif; background: var(--bg); color: var(--ink); }
  main { max-width: 900px; margin: 0 auto; padding: 24px 16px 64px; }
  h1 { font-weight: 600; font-size: 28px; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 20px; }
  form.row { display: flex; gap: 8px; margin-bottom: 16px; }
  input, textarea, button, select { font: inherit; color: inherit; background: transparent; border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; }
  input[type=search] { flex: 1; }
  button { cursor: pointer; }
  button.primary { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  .card { border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; margin: 10px 0; }
  .card h3 { margin: 0 0 4px; font-size: 17px; }
  .meta { color: var(--muted); font-size: 14px; }
  .map { display: flex; flex-wrap: wrap; gap: 3px; margin: 8px 0; }
  .sq { width: 14px; height: 14px; border-radius: 3px; background: var(--open); }
  .sq.in_flight { background: var(--flight); } .sq.sealed { background: var(--sealed); } .sq.needs_verify { background: var(--verify); }
  .sq.disputed { background: var(--disputed); } .sq.accepted_provisional { background: var(--prov); } .sq.accepted { background: var(--acc); }
  .sq.unreachable { background: var(--unreach); } .sq.locked { background: var(--locked); } .sq.unknown { background: var(--unknown); }
  .sq.challenged { background: var(--disputed); } .sq.judging { background: var(--sealed); }
  .sq.attested { outline: 2px dotted var(--muted); outline-offset: -2px; }
  .sq.verified { box-shadow: inset 0 0 0 2px #d4a017; }
  .sq.staked { border-bottom: 2px solid var(--ink); }
  form.pay { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin: 8px 0; } form.pay input { width: 110px; }
  pre { white-space: pre-wrap; word-break: break-word; font-size: 13px; background: var(--locked); padding: 10px; border-radius: 8px; }
  nav { display: flex; gap: 14px; margin-bottom: 18px; font-size: 15px; }
  nav a { color: var(--muted); text-decoration: none; cursor: pointer; } nav a.on { color: var(--ink); font-weight: 600; }
  section { display: none; } section.on { display: block; }
  .field { margin: 8px 0; } .field label { display: block; font-size: 14px; color: var(--muted); margin-bottom: 4px; }
  .field input, .field textarea { width: 100%; box-sizing: border-box; }
  .quiet { color: var(--muted); font-size: 14px; }
</style>
</head>
<body>
<main>
  <h1>Quilt</h1>
  <p class="sub">A torrent where the pieces are made, not copied.</p>
  <nav>
    <a data-tab="search" class="on">Search</a><a data-tab="problem">Problem</a><a data-tab="publish">Publish</a><a data-tab="library">Library</a><a data-tab="me">Me</a>
  </nav>

  <section id="search" class="on">
    <form class="row" id="searchForm"><input type="search" id="q" placeholder="citations, ai-safety, a slug, a hash, a quilt: link" autocomplete="off"><button class="primary" type="submit">Search</button></form>
    <p class="row"><button id="anyBtn">Hand me something to do</button></p>
    <div id="wanted"></div>
    <div id="results"></div>
  </section>

  <section id="problem">
    <div id="problemView" class="quiet">Open a problem from search, a link, or your library.</div>
    <div id="pieceView"></div>
  </section>

  <section id="publish">
    <div class="field"><label for="pattern">The pattern, as JSON: title, done_when, slug, pieces, data rows, topics</label><textarea id="pattern" rows="14"></textarea></div>
    <button class="primary" id="publishBtn">Publish, signed with this key</button>
    <pre id="publishOut" class="quiet"></pre>
  </section>

  <section id="library"><div id="libraryView"></div></section>

  <section id="me"><div id="standingView" class="quiet"></div><pre id="meView"></pre><button id="flushBtn">Post what waits in the queue</button></section>
</main>
<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  var el = function (tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text !== undefined) e.textContent = text; return e; };
  var api = function (path, opts) { return fetch(path, opts).then(function (r) { return r.json().then(function (j) { if (!r.ok) throw new Error(j.error || r.status); return j; }); }); };
  var show = function (tab) {
    document.querySelectorAll('nav a').forEach(function (a) { a.classList.toggle('on', a.dataset.tab === tab); });
    document.querySelectorAll('section').forEach(function (s) { s.classList.toggle('on', s.id === tab); });
  };
  document.querySelectorAll('nav a').forEach(function (a) { a.addEventListener('click', function () { show(a.dataset.tab); if (a.dataset.tab === 'library') library(); if (a.dataset.tab === 'me') me(); if (a.dataset.tab === 'search') wanted(); }); });

  var mapOf = function (pieces) {
    var m = el('div', 'map');
    pieces.forEach(function (p) {
      var s = el('div', 'sq ' + p.state + (p.attested ? ' attested' : '') + (p.verified ? ' verified' : '') + (p.stake ? ' staked' : ''));
      s.title = p.name + ': ' + p.state.replace('_', ' ') + ' (' + p.verifier + (p.strength ? ', ' + p.strength : '') + (p.weakest ? ', the weakest kind' : '') + (p.attested ? ', attested' : '') + (p.stake ? ', a stake of ' + p.stake : '') + (p.gold ? ', gold ' + p.gold : '') + (p.verified ? ', verified' : '') + ')';
      m.appendChild(s);
    });
    return m;
  };
  /** One line for something wanted from this person, in words. */
  var wantedWords = function (item) {
    var reason = { rank: 'you are drawn to judge', verdict: 'a verdict is wanted from you', disputed: 'a return of yours is disputed', person: 'a piece wants a person', gold: 'a reveal of your gold is due' }[item.why] || item.why;
    return (item.name ? item.name + ' in ' + item.title : item.title) + ': ' + reason;
  };
  var wanted = function () {
    api('/api/attention').then(function (a) {
      var w = $('wanted'); w.textContent = '';
      if (!a.items || !a.items.length) return;
      var c = el('div', 'card'); c.appendChild(el('h3', null, 'Wanted from you'));
      a.items.forEach(function (item) {
        var row = el('div', 'meta', wantedWords(item) + ' ');
        var b = el('button', null, 'Open'); b.addEventListener('click', function () { openProblem(item.problem); }); row.appendChild(b); c.appendChild(row);
      });
      w.appendChild(c);
    }).catch(function () { /* the list stays empty when nothing answers */ });
  };
  var post = function (path, data) { return api(path, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(data) }); };
  var ordinal = function (n) { return n + (n === 1 ? 'st' : n === 2 ? 'nd' : n === 3 ? 'rd' : 'th'); };
  /** A ranking form for a judge piece this person is drawn to: each candidate's return as text, and a place for each. */
  var judgeCard = function (problem, j) {
    var c = el('div', 'card');
    c.appendChild(el('h3', null, 'You are drawn to judge ' + j.name));
    c.appendChild(el('div', 'meta', j.verifier + ': ' + j.majority + ' of ' + j.panel + ' first choices decide. The candidates are shown without their signers.'));
    var form = el('form');
    var selects = [];
    j.candidates.forEach(function (cand, i) {
      var f = el('div', 'field');
      var label = el('label', null, 'Candidate ' + cand.digest.slice(7, 15) + ' returned:'); f.appendChild(label);
      f.appendChild(el('pre', null, JSON.stringify(cand.return, null, 2)));
      var sel = el('select'); sel.dataset.digest = cand.digest;
      j.candidates.forEach(function (_, k) { var op = el('option', null, ordinal(k + 1)); op.value = String(k + 1); sel.appendChild(op); });
      sel.value = String(i + 1); selects.push(sel); f.appendChild(sel); form.appendChild(f);
    });
    var submit = el('button', 'primary', 'Post this ranking, signed'); submit.type = 'submit'; form.appendChild(submit);
    var out = el('pre', 'quiet', ''); form.appendChild(out);
    form.addEventListener('submit', function (ev) {
      ev.preventDefault();
      var places = selects.map(function (s) { return { digest: s.dataset.digest, place: Number(s.value) }; });
      var seen = {}; var twice = places.some(function (x) { if (seen[x.place]) return true; seen[x.place] = true; return false; });
      if (twice) { out.textContent = 'Each place once.'; return; }
      places.sort(function (a, b) { return a.place - b.place; });
      out.textContent = 'Signing and posting…';
      api('/api/rank', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ problem: problem, piece: j.piece, ranking: places.map(function (x) { return x.digest; }) }) })
        .then(function (r) { out.textContent = 'Ranking ' + (r.queued ? 'queued' : 'posted') + '.'; openProblem(problem); })
        .catch(function (e) { out.textContent = e.message; });
    });
    c.appendChild(form);
    return c;
  };
  var countsOf = function (counts) { return Object.keys(counts).map(function (k) { return counts[k] + ' ' + k.replace('_', ' '); }).join(', '); };

  var currentProblem = null;
  var openProblem = function (link) {
    show('problem');
    $('problemView').textContent = 'Resolving…';
    $('pieceView').textContent = '';
    api('/api/open?link=' + encodeURIComponent(link)).then(function (p) {
      currentProblem = p.problem;
      var v = $('problemView'); v.textContent = ''; v.className = '';
      v.appendChild(el('h3', null, p.title));
      v.appendChild(el('div', 'meta', 'Published by ' + p.owner + (p.tracker ? ' · answered by ' + p.tracker : ' · from the cache')));
      if (p.hidden) v.appendChild(el('div', 'meta', 'Taken down on this tracker by ' + p.hidden.by + ': ' + p.hidden.why + ' (' + String(p.hidden.at).slice(0, 10) + '). The map below is still what the chain says.'));
      v.appendChild(el('p', null, 'Done when: ' + p.done_when));
      v.appendChild(mapOf(p.pieces));
      var counts = {}; p.pieces.forEach(function (x) { counts[x.state] = (counts[x.state] || 0) + 1; });
      v.appendChild(el('div', 'meta', p.pieces.length + ' pieces: ' + countsOf(counts) + (p.complete ? ' · complete' : '')));
      v.appendChild(el('div', 'meta', p.kinds + ' A dotted square is attested: accepted on the actor’s own word. A square ringed in gold is verified: the set agreed with the answer the owner committed to before the work. A square underlined asks a stake.'));
      var staked = p.pieces.filter(function (x) { return x.stake > 0; });
      if (staked.length) { var amounts = {}; staked.forEach(function (x) { amounts[x.stake] = true; }); v.appendChild(el('div', 'meta', 'Stake asked (QX-15): ' + staked.length + ' of the pieces ask ' + Object.keys(amounts).join(' or ') + ' of your standing, locked before the claim and forfeited if the acceptance is struck.')); }
      var golden = p.pieces.filter(function (x) { return x.gold; });
      if (golden.length) { var g = function (s) { return golden.filter(function (x) { return x.gold === s; }).length; }; v.appendChild(el('div', 'meta', 'Gold (QX-16): ' + golden.length + ' of the pieces have an answer the owner committed to before the work; ' + g('match') + ' verified, ' + g('miss') + ' missed, ' + g('pending') + ' awaiting the owner’s reveal.')); }
      var b = el('button', 'primary', 'Hand me a piece'); b.addEventListener('click', function () { takePiece(p.problem); }); v.appendChild(b);
      // QX-16: the reveals due from this key, where it committed the gold here.
      p.pieces.filter(function (x) { return x.mine_gold && x.gold === 'pending' && (x.state === 'accepted' || x.state === 'accepted_provisional' || x.state === 'challenged'); }).forEach(function (x) {
        var rb = el('button', null, 'Reveal the gold on ' + x.name); var ro = el('span', 'meta', '');
        rb.addEventListener('click', function () { rb.disabled = true; post('/api/reveal', { problem: p.problem, piece: x.hash }).then(function (r) { ro.textContent = r.outcome === 'match' ? ' The set agreed with the gold: the square is verified.' : r.outcome === 'miss' ? ' The set differed from the gold: it is struck and the piece is open again.' : ' Revealed.'; openProblem(p.problem); wanted(); }).catch(function (e) { rb.disabled = false; ro.textContent = ' ' + e.message; }); });
        var line = el('div', 'meta'); line.appendChild(rb); line.appendChild(ro); v.appendChild(line);
      });
      // QX-17: a pay, where the tracker that answered carries the coin.
      if (p.coin) {
        var pf = el('form', 'pay'); pf.appendChild(el('span', 'meta', 'Pay this problem’s workers in coin: '));
        var amount = el('input'); amount.type = 'number'; amount.min = '1'; amount.placeholder = 'units'; amount.required = true; pf.appendChild(amount);
        var per = el('input'); per.type = 'number'; per.min = '1'; per.placeholder = 'a square'; per.required = true; pf.appendChild(per);
        var ps = el('button', null, 'Escrow, signed'); ps.type = 'submit'; pf.appendChild(ps);
        var po = el('span', 'meta', ''); pf.appendChild(po);
        pf.addEventListener('submit', function (ev) { ev.preventDefault(); po.textContent = 'Signing and posting…'; post('/api/pay', { problem: p.problem, amount: Number(amount.value), per_square: Number(per.value) }).then(function (r) { po.textContent = 'Escrowed ' + amount.value + ' at ' + per.value + ' a square on ' + r.home + '. Each square accepted from now pays its set; what is left comes back when the problem completes.'; }).catch(function (e) { po.textContent = e.message; }); });
        v.appendChild(pf);
      }
      v.appendChild(el('div', 'meta', (p.seeders || 0) + (p.seeders === 1 ? ' seeder' : ' seeders') + (p.last_seeded ? ' · last seeded ' + String(p.last_seeded).slice(0, 10) : '')));
      var sb = el('button', null, p.seeding ? 'Stop keeping this problem' : 'Keep this problem'); sb.addEventListener('click', function () { sb.disabled = true; api('/api/seed', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ problem: p.problem, on: !p.seeding }) }).then(function () { openProblem(p.problem); }).catch(function (e) { sb.disabled = false; sb.textContent = e.message; }); }); v.appendChild(sb);
      (p.judging || []).forEach(function (j) { v.appendChild(judgeCard(p.problem, j)); });
      v.appendChild(el('h3', null, 'Accepted so far'));
      v.appendChild(el('pre', null, p.accepted));
      v.appendChild(el('pre', 'quiet', p.summary));
    }).catch(function (e) { $('problemView').textContent = e.message; });
  };

  var takePiece = function (problem) {
    var pv = $('pieceView'); pv.textContent = problem ? 'Asking for the rarest piece…' : 'Asking the standing list, then the trackers, for something to do…';
    api('/api/next?problem=' + encodeURIComponent(problem)).then(function (pk) {
      pv.textContent = '';
      if (!problem) { currentProblem = pk.problem; var pvw = $('problemView'); pvw.textContent = 'From problem ' + pk.problem + '. Its map is in your library.'; pvw.className = 'quiet'; }
      var c = el('div', 'card');
      c.appendChild(el('h3', null, pk.name + ' · ' + (pk.posted.queued ? 'claim queued' : 'claimed')));
      if (pk.kind) c.appendChild(el('div', 'meta', 'Kind ' + pk.verifier + ', ' + pk.kind.strength + ': ' + pk.kind.says + '.'));
      if (pk.stake) c.appendChild(el('div', 'meta', 'A stake of ' + pk.stake + (pk.lock === 'coin' ? ', backed by coin locked on the coin log in place of standing' : ' of your standing, locked behind the claim') + ': released when the window closes, forfeited if the acceptance is struck.'));
      c.appendChild(el('div', 'meta', 'The author, ' + pk.author + ', wrote:'));
      c.appendChild(el('pre', null, pk.brief));
      var form = el('form');
      var fields = pk.schema ? Object.keys(pk.schema.properties) : ['patch'];
      fields.forEach(function (name) {
        var def = pk.schema ? pk.schema.properties[name] : { type: 'string' };
        var f = el('div', 'field'); var label = el('label', null, name + (pk.agree.indexOf(name) >= 0 ? ' (agreement is on this)' : ' (evidence)')); label.htmlFor = 'f_' + name; f.appendChild(label);
        var input;
        if (def.enum) { input = el('select'); def.enum.forEach(function (o) { var op = el('option', null, o); op.value = o; input.appendChild(op); }); }
        else if (def.type === 'boolean') { input = el('select'); ['true', 'false'].forEach(function (o) { var op = el('option', null, o); op.value = o; input.appendChild(op); }); }
        else if (def.type === 'number' || def.type === 'integer') { input = el('input'); input.type = 'number'; }
        else { input = el('textarea'); input.rows = name === 'patch' ? 8 : 3; }
        input.id = 'f_' + name; input.dataset.kind = def.enum ? 'enum' : (def.type || 'string'); f.appendChild(input); form.appendChild(f);
      });
      var submit = el('button', 'primary', 'Hand it back, signed'); submit.type = 'submit'; form.appendChild(submit);
      var out = el('pre', 'quiet', ''); form.appendChild(out);
      form.addEventListener('submit', function (ev) {
        ev.preventDefault();
        var ret = {};
        fields.forEach(function (name) { var i = $('f_' + name); var kind = i.dataset.kind; var v = i.value; if (kind === 'number' || kind === 'integer') v = Number(v); if (kind === 'boolean') v = v === 'true'; ret[name] = v; });
        out.textContent = 'Signing and posting…';
        api('/api/return', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ problem: pk.problem, piece: pk.piece, return: ret }) })
          .then(function (r) { out.textContent = 'Commit ' + (r.commit.queued ? 'queued' : 'posted') + '; reveal ' + (r.reveal.queued ? 'queued' : 'posted') + '. ' + (r.waits || ''); openProblem(pk.problem); })
          .catch(function (e) { out.textContent = e.message; });
      });
      c.appendChild(form); pv.appendChild(c);
    }).catch(function (e) { pv.textContent = e.message; });
  };

  $('searchForm').addEventListener('submit', function (ev) {
    ev.preventDefault();
    var q = $('q').value.trim();
    if (/^(quilt:|https?:\/\/|sha256:)/.test(q)) { openProblem(q); return; }
    var r = $('results'); r.textContent = 'Searching…';
    api('/api/search?q=' + encodeURIComponent(q)).then(function (j) {
      r.textContent = '';
      if (!j.problems.length) { r.appendChild(el('p', 'quiet', 'Nothing matched on the trackers and relays this client knows.')); return; }
      j.problems.forEach(function (p) {
        var c = el('div', 'card');
        var h = el('h3', null, p.title); c.appendChild(h);
        c.appendChild(el('div', 'meta', p.slug + ' · by ' + p.owner + (p.topics.length ? ' · ' + p.topics.join(', ') : '') + ' · at ' + p.tracker));
        c.appendChild(el('div', 'meta', p.via === 'relay' ? 'found on a relay; its map is read when you open it' : p.pieces + ' pieces: ' + countsOf(p.counts)));
        var b = el('button', null, 'Open'); b.addEventListener('click', function () { openProblem(p.problem); }); c.appendChild(b);
        r.appendChild(c);
      });
    }).catch(function (e) { r.textContent = e.message; });
  });

  $('publishBtn').addEventListener('click', function () {
    var out = $('publishOut'); out.textContent = 'Signing and publishing…';
    var pattern;
    try { pattern = JSON.parse($('pattern').value); } catch (e) { out.textContent = 'The pattern is not JSON: ' + e.message; return; }
    api('/api/publish', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(pattern) })
      .then(function (r) { out.textContent = 'Published ' + r.hash + '\nLink: ' + r.link + '\nCarried by: ' + (r.posted.join(', ') || 'nobody yet') + (r.refused.length ? '\nRefused: ' + r.refused.join('; ') : ''); openProblem(r.hash); })
      .catch(function (e) { out.textContent = e.message; });
  });

  var library = function () {
    api('/api/library').then(function (lib) {
      var v = $('libraryView'); v.textContent = '';
      var hashes = Object.keys(lib.problems);
      if (!hashes.length) { v.appendChild(el('p', 'quiet', 'Nothing yet. Problems you open, publish or work appear here.')); return; }
      hashes.forEach(function (h) {
        var p = lib.problems[h]; var c = el('div', 'card');
        c.appendChild(el('h3', null, p.title)); c.appendChild(el('div', 'meta', p.slug + ' · last ' + p.last + ' · ' + p.trackers.join(', ')));
        var b = el('button', null, 'Open'); b.addEventListener('click', function () { openProblem(h); }); c.appendChild(b); v.appendChild(c);
      });
      var pieces = Object.keys(lib.pieces);
      if (pieces.length) { v.appendChild(el('h3', null, 'Pieces')); pieces.forEach(function (ph) { var x = lib.pieces[ph]; v.appendChild(el('div', 'meta', x.name + ' · ' + x.what + ' · ' + x.when)); }); }
    });
  };
  $('anyBtn').addEventListener('click', function () { show('problem'); takePiece(''); });
  var me = function () {
    api('/api/me').then(function (m) { $('meView').textContent = JSON.stringify(m, null, 2); });
    var sv = $('standingView'); sv.textContent = 'Asking the trackers for your standing…';
    api('/api/standing').then(function (s) {
      sv.textContent = '';
      var st = s.standing; var c = s.coin;
      sv.appendChild(el('div', null, st ? 'Standing ' + st.standing + ' (locked ' + st.locked + ', free ' + st.free + ') at ' + st.tracker + (st.locks.length ? '; ' + st.locks.length + (st.locks.length === 1 ? ' lock' : ' locks') + ' behind your claims' : '') : 'Standing: no tracker answered.'));
      sv.appendChild(el('div', null, c ? 'Coin (QX-17): ' + c.balance + ' units, ' + c.vested + ' vested, ' + c.locked + ' locked, ' + c.escrowed + ' escrowed, ' + c.free + ' free, at ' + c.home : 'Coin: no tracker this client knows carries one.'));
      if (c) {
        // QX-17: a transfer to an address, and a redeem to the chain, each signed here and posted to the coin's home.
        var tf = el('form', 'pay'); tf.appendChild(el('span', 'meta', 'Move coin to an address: '));
        var tto = el('input'); tto.type = 'text'; tto.placeholder = '0x…'; tto.required = true; tto.style.width = '24em'; tf.appendChild(tto);
        var tam = el('input'); tam.type = 'number'; tam.min = '1'; tam.placeholder = 'units'; tam.required = true; tf.appendChild(tam);
        var ts = el('button', null, 'Transfer, signed'); ts.type = 'submit'; tf.appendChild(ts);
        var to = el('span', 'meta', ''); tf.appendChild(to);
        tf.addEventListener('submit', function (ev) { ev.preventDefault(); to.textContent = 'Signing and posting…'; post('/api/transfer', { to: tto.value.trim(), amount: Number(tam.value) }).then(function (r) { to.textContent = 'Moved ' + tam.value + ' units to ' + tto.value.trim() + ' on ' + r.home + '.'; me(); }).catch(function (e) { to.textContent = e.message; }); });
        sv.appendChild(tf);
        var rf = el('form', 'pay'); rf.appendChild(el('span', 'meta', 'Redeem to the chain (the coin leaves the ledger; the Quilt token is minted once the bridge carries the line): '));
        var ram = el('input'); ram.type = 'number'; ram.min = '1'; ram.placeholder = 'units'; ram.required = true; rf.appendChild(ram);
        var rs = el('button', null, 'Redeem, signed'); rs.type = 'submit'; rf.appendChild(rs);
