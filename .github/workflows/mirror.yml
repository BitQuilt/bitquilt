name: mirror
# The one automated writer to main: pulls from the trackers named in the BITQUILT_TRACKERS repository variable,
# verifies every envelope, blob and chain, refuses a chain that did anything but grow, and commits what changed.
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
jobs:
  mirror:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @bitquilt/mirror start --trackers "${{ vars.BITQUILT_TRACKERS }}" --out mirror --anchor
      - name: commit what grew
        run: |
          git config user.name "bitquilt mirror"
          git config user.email "mirror@users.noreply.github.com"
          git add mirror
          git diff --cached --quiet || git commit -m "mirror: $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
