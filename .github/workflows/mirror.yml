name: mirror
# The one automated writer to main: pulls from the trackers named in the BITQUILT_TRACKERS repository variable,
# verifies every envelope, blob and chain, refuses a chain that did anything but grow, and commits what changed.
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
jobs:
  mirror:
    # Until the variable names a tracker there is nothing to mirror: the job is skipped, which costs no minutes on a private repository.
    if: ${{ vars.BITQUILT_TRACKERS != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # pnpm runs the mirror inside packages/mirror, so the folder is named from the workspace root.
      - run: pnpm --filter @bitquilt/mirror start --trackers "${{ vars.BITQUILT_TRACKERS }}" --out "$GITHUB_WORKSPACE/mirror" --anchor
      - name: commit what grew
        run: |
          git config user.name "bitquilt mirror"
          git config user.email "mirror@users.noreply.github.com"
          # The mirror always writes its index and its keys, so a missing folder is a wrong path, and the run fails.
          test -d mirror || { echo "no mirror folder at $GITHUB_WORKSPACE/mirror"; exit 1; }
          git add mirror
          git diff --cached --quiet || git commit -m "mirror: $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
