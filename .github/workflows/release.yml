name: release
# Single executables per platform, built on a runner of each, and the MCP Bundle for Claude Desktop, one file for
# every platform, all attached to the release of a tag v*.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
jobs:
  build:
    strategy:
      # One platform's failure leaves the others' executables standing.
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            name: darwin-arm64
          - os: macos-13
            name: darwin-x64
          - os: ubuntu-24.04
            name: linux-x64
          - os: ubuntu-24.04-arm
            name: linux-arm64
          - os: windows-2022
            name: win32-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: node scripts/build-binaries.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.name }}
          path: dist/bin/*
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:mcpb
      - uses: actions/upload-artifact@v4
        with:
          name: quilt-mcpb
          path: dist/quilt.mcpb
  # The Mac app, signed with the Developer ID and notarized, when the repository's variable APPLE_SIGNING is "on" and the
  # secrets are set: APPLE_CERTIFICATE_P12 (the Developer ID Application certificate with its key, base64), its
  # APPLE_CERTIFICATE_PASSWORD, APPLE_SIGN_IDENTITY (the identity's name, "Developer ID Application: Name (TEAMID)"),
  # and an App Store Connect API key with the Developer role: APPLE_API_KEY (the .p8, base64), APPLE_API_KEY_ID,
  # APPLE_API_ISSUER. apps/mac/README.md says how each is made. Nothing the job prints carries any of them.
  mac-app:
    if: ${{ vars.APPLE_SIGNING == 'on' }}
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/build-binaries.mjs
      - run: pnpm build:mcpb
      - name: Import the Developer ID into a keychain of its own
        env:
          P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          P12_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password="$(openssl rand -hex 16)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/developer-id.p12"
          security import "$RUNNER_TEMP/developer-id.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain"
          security list-keychain -d user -s "$keychain" login.keychain
          rm -f "$RUNNER_TEMP/developer-id.p12"
      - name: Store the notary credentials
        env:
          API_KEY: ${{ secrets.APPLE_API_KEY }}
          API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          echo "$API_KEY" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          xcrun notarytool store-credentials quilt --key "$RUNNER_TEMP/AuthKey.p8" --key-id "$API_KEY_ID" --issuer "$API_ISSUER"
          rm -f "$RUNNER_TEMP/AuthKey.p8"
      - name: Build, sign, notarize and staple
        env:
          QUILT_SIGN_IDENTITY: ${{ secrets.APPLE_SIGN_IDENTITY }}
          QUILT_NOTARY_PROFILE: quilt
        run: |
          bash apps/mac/build.sh
          bash scripts/notarize.sh
      - uses: actions/upload-artifact@v4
        with:
          name: quilt-mac-app
          path: dist/Quilt.app.zip
  release:
    needs: [build, bundle, mac-app]
    if: ${{ always() && startsWith(github.ref, 'refs/tags/v') && needs.build.result == 'success' && needs.bundle.result == 'success' && needs.mac-app.result != 'failure' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist/bin
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/bin/*
