name: Quilt

# The iPhone app around a hosted address (apps/ios/README.md). XcodeGen writes Quilt.xcodeproj and Info.plist from this
# file, and neither is committed:
#   xcodegen generate            (from this folder)
#   ./build-testflight.sh        archives and exports; --upload sends the build to TestFlight

options:
  bundleIdPrefix: org.bitquilt
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

# secp256k1, the curve of every key on the wire, which Apple's own libraries do not carry: bitcoin-core's library in
# its Swift package, pinned to one release.
packages:
  swift-secp256k1:
    url: https://github.com/21-DOT-DEV/swift-secp256k1
    exactVersion: 0.25.1

targets:
  Quilt:
    type: application
    platform: iOS
    dependencies:
      - package: swift-secp256k1
        product: P256K
    scheme:
      testTargets:
        - QuiltTests
    sources:
      - path: Sources
      - path: Resources/Assets.xcassets
      # The three faces the Mac app and the site use, each with its licence beside it.
      - path: ../mac/Resources/Fonts
        buildPhase: resources
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Quilt
        CFBundleShortVersionString: "0.4.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UIAppFonts:
          - AtkinsonHyperlegible-Regular.ttf
          - AtkinsonHyperlegible-Bold.ttf
          - IBMPlexMono-Regular.ttf
          - IBMPlexMono-Medium.ttf
          - YoungSerif-Regular.ttf
        # The one scheme the app asks about: whether Claude's app is on this phone.
        LSApplicationQueriesSchemes:
          - claude
        # The person is asked for before the phone's key signs a problem that goes out under their name.
        NSFaceIDUsageDescription: Quilt asks for you before your key signs a problem that is published under your name.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # The app speaks HTTPS to its tracker and uses no encryption of its own.
        ITSAppUsesNonExemptEncryption: false
        # A tracker on this machine, for a run in the simulator with -tracker http://localhost:3977/.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.bitquilt.quilt
        DEVELOPMENT_TEAM: 8PB5R5CS37
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  # The phone's wire held to the reference's vectors (Tests/vectors.json, written by Tests/vectors.ts).
  QuiltTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
        excludes:
          - "*.ts"
    dependencies:
      - target: Quilt
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.bitquilt.quilt.tests
        DEVELOPMENT_TEAM: 8PB5R5CS37
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
