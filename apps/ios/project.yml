name: Quilt

# The iPhone app around a hosted address (apps/ios/README.md). XcodeGen writes Quilt.xcodeproj and Info.plist from this
# file, and neither is committed:
#   xcodegen generate            (from this folder)
#   ./build-testflight.sh        archives and exports; --upload sends the build to TestFlight

options:
  bundleIdPrefix: org.bitquilt
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

targets:
  Quilt:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources/Assets.xcassets
      # The three faces the Mac app and the site use, each with its licence beside it.
      - path: ../mac/Resources/Fonts
        buildPhase: resources
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Quilt
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UIAppFonts:
          - AtkinsonHyperlegible-Regular.ttf
          - AtkinsonHyperlegible-Bold.ttf
          - IBMPlexMono-Regular.ttf
          - IBMPlexMono-Medium.ttf
          - YoungSerif-Regular.ttf
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # The app speaks HTTPS to its tracker and uses no encryption of its own.
        ITSAppUsesNonExemptEncryption: false
        # A tracker on this machine, for a run in the simulator with -tracker http://localhost:3977/.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.bitquilt.quilt
        DEVELOPMENT_TEAM: 8PB5R5CS37
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
