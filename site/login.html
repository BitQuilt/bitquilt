<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Logging in to Quilt</title>
<!-- Where the tracker sends a person back after they allow this site (site/README.md, Logging in): the code is exchanged here, in the browser, for the tokens this tab keeps, and the page returns to where the login began. Nothing is loaded from elsewhere, and what the script puts on the page it sets with textContent. -->
<style>
:root { color-scheme: light dark; }
body { margin: 0; font: 17px/1.5 system-ui, sans-serif; background: #f6f2ea; color: #1c1a17; }
@media (prefers-color-scheme: dark) { body { background: #0f1526; color: #e8e8e6; } }
main { max-width: 560px; margin: 0 auto; padding: 60px 16px; }
a { color: inherit; }
</style>
</head>
<body>
<main>
<p id="say">Logging you in.</p>
<p><a href="/">Back to the front page</a></p>
<script>
(function () {
  'use strict';
  var say = document.getElementById('say');
  var fail = function (m) { say.textContent = m; };
  var q = new URLSearchParams(location.search);
  var pending = null;
  try { pending = JSON.parse(sessionStorage.getItem('quilt.login.pending') || 'null'); sessionStorage.removeItem('quilt.login.pending'); } catch (e) {}
  if (q.get('error')) { fail('The tracker did not log you in: ' + (q.get('error_description') || q.get('error')) + '.'); return; }
  var code = q.get('code'), state = q.get('state');
  if (!pending || !code || !state || state !== pending.state) { fail('This page follows a login begun on the front page, and none is pending in this tab.'); return; }
  if (q.get('iss') && q.get('iss') !== pending.tracker.replace(/\/$/, '')) { fail('The answer came from another tracker than the one asked.'); return; }
  // The exchange: the code and the verifier kept when the login began, as a form, which needs no preflight; the tokens live in this tab alone.
  var body = new URLSearchParams({ grant_type: 'authorization_code', code: code, redirect_uri: location.origin + location.pathname, client_id: pending.client, code_verifier: pending.verifier, resource: pending.tracker + 'mcp' });
  fetch(pending.tracker + 'oauth/token', { method: 'POST', body: body })
    .then(function (r) { return r.json().then(function (j) { if (!r.ok) throw new Error(j.error_description || j.error || r.status); return j; }); })
    .then(function (j) {
      sessionStorage.setItem('quilt.login', JSON.stringify({ access: j.access_token, refresh: j.refresh_token || null, until: Date.now() + (Number(j.expires_in) || 3600) * 1000, tracker: pending.tracker, client: pending.client }));
      location.replace(pending.back && pending.back.charAt(0) === '/' ? pending.back : '/');
    })
    .catch(function (e) { fail('The tracker did not log you in: ' + e.message + '.'); });
})();
</script>
</main>
</body>
</html>
