# The public tracker with the hosted on-ramp, behind Caddy, on one small host (docs/DEPLOY.md says what each variable
# is; docs/JOURNEY-AUDIT.md section 4 says the order it is brought up in). Everything the tracker keeps is the volume.
# Beside it, the house second opinion: the OpenAI worker from the same image, giving a second reading to pieces another
# vendor returned (docs/DEPLOY.md, "The house second opinion"). It runs nothing until its vendor's key is set.
#   cp deploy/env.example deploy/.env   # then fill it in; the file stays on the host and never in the repository
#   docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d --build
services:
  tracker:
    build:
      context: ..
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - data:/data
    expose:
      - "3977"
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - tracker
  house:
    build:
      context: ..
    restart: unless-stopped
    command: ["sh", "deploy/house.sh"]
    # Only its own names from the env file, not the tracker's; the claim declares the model the reveal is made with.
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      HOUSE: ${HOUSE:-on}
      HOUSE_VENDOR: ${HOUSE_VENDOR:-anthropic}
      HOUSE_MODEL: ${HOUSE_MODEL:-claude-opus-5-5}
      QUILT_MODEL: ${HOUSE_VENDOR:-anthropic}/${HOUSE_MODEL:-claude-opus-5-5}
      QUILT_TRACKERS: http://tracker:3977/
      QUILT_HOME: /house
      QUILT_BIN: pnpm -s --filter quilt start
    volumes:
      - house:/house
    depends_on:
      - tracker
volumes:
  data:
  caddy_data:
  caddy_config:
  house:
