# The public tracker with the hosted on-ramp, behind Caddy, on one small host (docs/DEPLOY.md says what each variable
# is; docs/JOURNEY-AUDIT.md section 4 says the order it is brought up in). Everything the tracker keeps is the volume.
# Beside it, the house second opinion: two workers from the same image, `house` on Anthropic unless HOUSE_VENDOR says
# openai and `house-openai` on OpenAI, each giving a second reading to pieces that have a reading on them (docs/DEPLOY.md,
# "The house second opinion"). Each runs nothing until its vendor's key is set.
#   cp deploy/env.example deploy/.env   # then fill it in; the file stays on the host and never in the repository
#   docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d --build
services:
  # The public door with the on-ramp: one node with the roles admit and host (WORKSHOP.md section 2), over the store the
  # hosted tracker kept before (QUILT_DB, /data/tracker.db, set by the image).
  tracker:
    build:
      context: ..
    restart: unless-stopped
    command: ["pnpm", "--filter", "@bitquilt/node", "start"]
    env_file:
      - .env
    environment:
      QUILT_ROLES: admit,host
      QUILT_HOME: /data
    volumes:
      - data:/data
    expose:
      - "3977"
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - tracker
  house:
    build:
      context: ..
    restart: unless-stopped
    command: ["sh", "deploy/house.sh"]
    # A stop reaches the loop as SIGTERM: it finishes the piece in its hands and claims no other (house.sh), and is given
    # the time a reading takes. Killed inside a reading, a house leaves a claim that stands for its lease with no reveal.
    stop_grace_period: 10m
    # Only its own names from the env file, not the tracker's; the claim declares the model the reveal is made with.
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      HOUSE: ${HOUSE:-on}
      HOUSE_VENDOR: ${HOUSE_VENDOR:-anthropic}
      HOUSE_MODEL: ${HOUSE_MODEL:-claude-opus-5-5}
      QUILT_MODEL: ${HOUSE_VENDOR:-anthropic}/${HOUSE_MODEL:-claude-opus-5-5}
      QUILT_TRACKERS: http://tracker:3977/
      QUILT_HOME: /house
      QUILT_BIN: pnpm -s --filter quilt start
    volumes:
      - house:/house
    depends_on:
      - tracker
  # A second house on the other vendor, with its own key and name, so a piece first read by either vendor's AI gets
  # its second from the other. It runs nothing until OPENAI_API_KEY is set.
  house-openai:
    build:
      context: ..
    restart: unless-stopped
    command: ["sh", "deploy/house.sh"]
    stop_grace_period: 10m
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      HOUSE: ${HOUSE:-on}
      HOUSE_VENDOR: openai
      HOUSE_NAME: House second opinion on OpenAI
      HOUSE_MODEL: ${HOUSE_OPENAI_MODEL:-gpt-6-luna}
      QUILT_MODEL: openai/${HOUSE_OPENAI_MODEL:-gpt-6-luna}
      QUILT_TRACKERS: http://tracker:3977/
      QUILT_HOME: /house-openai
      QUILT_BIN: pnpm -s --filter quilt start
    volumes:
      - house_openai:/house-openai
    depends_on:
      - tracker
  # The second peer (docs/DEPLOY.md, "The second peer"): the reference tracker alone, with its own store, at /two/ under
  # the same name, naming the first door as its peer as the first names it, so the two fold each other's chains every
  # five minutes (QX-21). No on-ramp and no coin here: the coin log has one home (QX-17).
  tracker-two:
    build:
      context: ..
    restart: unless-stopped
    command: ["pnpm", "--filter", "@bitquilt/node", "start"]
    environment:
      QUILT_ROLES: admit
      QUILT_HOME: /data
      QUILT_URL: ${TWO_URL:-https://tracker.bitquilt.org/two/}
      QUILT_NAME: ${TWO_NAME:-BitQuilt, second door}
      QUILT_PEERS: ${QUILT_URL:-https://tracker.bitquilt.org/}
      QUILT_MAINTAINERS: ${QUILT_MAINTAINERS:-}
      QUILT_FOUNDING_STANDING: ${QUILT_FOUNDING_STANDING:-}
      QUILT_IP_SALT: ${QUILT_IP_SALT:-}
      QUILT_LIMIT_KEY_HOUR: ${QUILT_LIMIT_KEY_HOUR:-120}
      QUILT_LIMIT_IP_HOUR: ${QUILT_LIMIT_IP_HOUR:-600}
      QUILT_STAMP_NAME: ${QUILT_STAMP_NAME:-0}
    volumes:
      - data_two:/data
    expose:
      - "3977"
  # The relay (QX-14): a Nostr relay of this host's own at /relay, where members' Quilts announce and search, so the
  # swarm's directory runs here while nothing is said on a public relay. Its database is the volume.
  relay:
    image: dockurr/strfry
    restart: unless-stopped
    volumes:
      - ./strfry.conf:/etc/strfry.conf:ro
      - relay:/app/strfry-db
    expose:
      - "7777"
volumes:
  data:
  data_two:
  relay:
  caddy_data:
  caddy_config:
  house:
  house_openai:
